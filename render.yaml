services:
  - type: web
    name: first-leg-cost
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.8"
